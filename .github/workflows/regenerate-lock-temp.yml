name: Regenerate package lock temporary

on:
  push:
    branches:
      - chore/upgrade-tailwind-v4

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/upgrade-tailwind-v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Remove autoprefixer from package.json
        run: npm pkg delete devDependencies.autoprefixer

      - name: Regenerate package-lock.json
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Validate dependency files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); JSON.parse(require('fs').readFileSync('package-lock.json', 'utf8'))"
          npm ci --ignore-scripts

      - name: Commit regenerated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "fix: regenerate dependency lockfile"
          git push origin HEAD:chore/upgrade-tailwind-v4
