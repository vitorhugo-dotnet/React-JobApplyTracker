name: Regenerate package lock (temporary)

on:
  push:
    branches:
      - chore/upgrade-tailwind-v4

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Remove autoprefixer from package.json
        run: npm pkg delete devDependencies.autoprefixer

      - name: Regenerate package-lock.json
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Validate dependency files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); JSON.parse(require('fs').readFileSync('package-lock.json', 'utf8'))"
          npm ci --ignore-scripts

      - name: Upload dependency files
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-dependency-files
          path: |
            package.json
            package-lock.json
          retention-days: 1
